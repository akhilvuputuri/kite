name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  # The reference npm is the one bundled with the Node version Chief pins.
  NODE_VERSION: "22.23.4"
jobs:
  rust:
    name: fmt, clippy and unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain && cargo --version
      - run: cargo fmt --check
      - run: cargo clippy --locked --release -- -D warnings
      - run: cargo test --locked

  parity:
    name: npm parity ${{ matrix.fixture }} ${{ matrix.flags }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        fixture: [chief, pi]
        flags: ["", "--ignore-scripts", "--omit=dev", "--omit=dev --ignore-scripts"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: cargo build --locked --release
      - name: npm ci vs lockstep ci
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
          LOCKSTEP_STORE: ${{ runner.temp }}/lockstep-store
          PARITY_WORK: ${{ runner.temp }}/parity
        run: |
          npm --version
          # shellcheck disable=SC2086
          harness/parity.sh tests/fixtures/${{ matrix.fixture }} target/release/lockstep ${{ matrix.flags }}
      - name: Show the difference
        if: failure()
        run: head -200 "${{ runner.temp }}/parity/${{ matrix.fixture }}.diff" || true
