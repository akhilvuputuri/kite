name: bench
# Informational: cold and warm installs of Chief's lockfile against Bun on
# GitHub's runners, sweeping kite's download concurrency. Never gates.
on:
  pull_request:
    branches: [main]
    paths: ["src/**", "harness/**", "Cargo.*", ".github/workflows/bench.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bench:
    name: bench (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22.23.4" }
      - name: Build
        run: echo "BIN=$(harness/build.sh)" >> "$GITHUB_ENV"
      - name: Sweep download concurrency against Bun
        run: |
          npm install -g bun@1.2.23 >/dev/null
          {
            echo "### ${{ matrix.os }} ($(nproc) CPUs), Chief's root lockfile, median of 5, scripts off"
            echo
            echo "Bun:"
            BENCH_TOOLS=bun harness/bench.sh tests/fixtures/chief "$BIN" 5
            for n in 16 32 48 64 96; do
              echo
              echo "kite, KITE_NETWORK_CONCURRENCY=$n:"
              KITE_NETWORK_CONCURRENCY=$n BENCH_TOOLS=kite harness/bench.sh tests/fixtures/chief "$BIN" 5
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
