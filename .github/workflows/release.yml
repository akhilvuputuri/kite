name: release
# Pushing a tag vX.Y.Z builds the binaries, proves them, and publishes a
# GitHub release with SHA-256 checksums. Nothing is published unless every
# platform builds reproducibly and matches npm on the parity fixtures.
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
env:
  NODE_VERSION: "22.23.4"
jobs:
  gate:
    name: tag is on main with green CI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: The tagged commit is on main and its ci run passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME is not on main"; exit 1; }
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=completed" --jq '[.workflow_runs[].conclusion] | if index("success") then "success" else "none" end')
          test "$conclusion" = success || { echo "no successful ci run for $GITHUB_SHA"; exit 1; }
      - name: Release notes exist for this version
        run: |
          notes=$(awk -v v="## ${GITHUB_REF_NAME#v}" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md)
          test -n "$(echo "$notes" | tr -d '[:space:]')" || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; }

  build:
    needs: gate
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, asset: lockstep-linux-x64 }
          - { os: ubuntu-24.04-arm, asset: lockstep-linux-arm64 }
          - { os: macos-15, asset: lockstep-darwin-arm64 }
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != Cargo.toml $version"; exit 1; }
      - name: Build twice and compare (reproducibility)
        run: |
          first=$(harness/build.sh)
          cp "$first" "$RUNNER_TEMP/first"
          cargo clean
          second=$(harness/build.sh)
          a=$(shasum -a 256 "$RUNNER_TEMP/first" | cut -d' ' -f1)
          b=$(shasum -a 256 "$second" | cut -d' ' -f1)
          echo "first $a"; echo "second $b"
          test "$a" = "$b"
          mkdir -p dist
          cp "$second" "dist/${{ matrix.asset }}"
          (cd dist && shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")
          file "dist/${{ matrix.asset }}"
          "dist/${{ matrix.asset }}" --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/
          if-no-files-found: error

  verify:
    name: verify ${{ matrix.asset }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, asset: lockstep-linux-x64 }
          - { os: ubuntu-24.04-arm, asset: lockstep-linux-arm64 }
          - { os: macos-15, asset: lockstep-darwin-arm64 }
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/../npm-cache
      LOCKSTEP_STORE: ${{ github.workspace }}/../lockstep-store
      PARITY_WORK: ${{ github.workspace }}/../parity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - uses: actions/download-artifact@v4
        with: { name: "${{ matrix.asset }}", path: dist }
      - name: Checksum and parity with npm ci
        run: |
          cd dist && shasum -a 256 -c "${{ matrix.asset }}.sha256" && cd ..
          chmod +x "dist/${{ matrix.asset }}"
          bin="$PWD/dist/${{ matrix.asset }}"
          for fx in chief pi; do
            harness/parity.sh "tests/fixtures/$fx" "$bin"
            harness/parity.sh "tests/fixtures/$fx" "$bin" --omit=dev
          done
          RESOLVE_DROP_LOCK=1 harness/resolve-parity.sh tests/fixtures/chief "$bin" fresh-chief install
      - name: Benchmark against npm, pnpm and Bun
        # Informational: an outage of a comparison tool must not block a release.
        continue-on-error: true
        run: |
          npm install -g pnpm@9.15.9 bun@1.2.23 >/dev/null
          {
            echo "### ${{ matrix.asset }} (${{ matrix.os }}, $(nproc 2>/dev/null || sysctl -n hw.ncpu) CPUs)"
            echo
            echo "Clean install of Chief's root lockfile (367 packages), median of 3, scripts off."
            echo
            harness/bench.sh tests/fixtures/chief "dist/${{ matrix.asset }}" 3
          } | tee "bench-${{ matrix.asset }}.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.asset }}
          path: bench-${{ matrix.asset }}.md
          if-no-files-found: ignore

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          cp artifacts/lockstep-*/lockstep-* dist/
          (cd dist && cat *.sha256 > SHA256SUMS && cat SHA256SUMS)
          {
            awk -v v="## ${GITHUB_REF_NAME#v}" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md
            echo
            echo "## Benchmarks"
            echo
            cat artifacts/bench-*/bench-*.md 2>/dev/null || echo "Benchmarks did not run for this release."
            echo
            echo "## Checksums (SHA-256)"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "lockstep $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
