[package]
name = "lockstep"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A lockfile-exact JavaScript package installer and script runner, compatible with npm's package-lock.json"
license = "MIT"
repository = "https://github.com/akhilvuputuri/lockstep"
publish = false

[dependencies]
base64 = "0.22"
flate2 = "1"
libc = "0.2"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
