[package]
name = "kite-pm"
version = "0.1.1"
edition = "2024"
rust-version = "1.90"
description = "A fast, npm-compatible JavaScript package manager: install, resolve and run with byte-identical npm results"
license = "MIT"
repository = "https://github.com/akhilvuputuri/kite"
publish = false

[[bin]]
name = "kite"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
libc = "0.2"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
